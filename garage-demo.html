<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2Temps Deals — Maquette Garage 4D</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#04080F;
  --nuit:#081A30;
  --marine:#0E2440;
  --ciel:#7EC8F5;
  --neon:#5FD4FF;
  --glacier:#BFE3FB;
  --ambre:#FFC978;
  --rouge:#E63946;
  --beton:#1B222B;
  --acier:#8FA6BA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;overflow:hidden;background:var(--noir);color:#fff;
  font-family:'Archivo',system-ui,sans-serif;font-variation-settings:'wdth' 92;
  -webkit-tap-highlight-color:transparent;
}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none !important}

/* ═══ BADGE MAQUETTE ═══ */
.badge-maquette{
  position:fixed;top:14px;left:14px;z-index:500;
  display:flex;align-items:center;gap:8px;
  background:rgba(4,8,15,.72);backdrop-filter:blur(8px);
  border:1px solid rgba(95,212,255,.3);border-radius:999px;
  padding:8px 14px 8px 10px;font-family:'Space Mono',monospace;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--neon);
}
.badge-maquette .point{width:7px;height:7px;border-radius:50%;background:var(--rouge);animation:pulse 1.6s ease infinite}
.badge-maquette a{color:var(--acier);text-decoration:underline;margin-left:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ═══ ÉCRAN INTRO — FAÇADE ═══ */
#intro{
  position:fixed;inset:0;z-index:100;
  background:
    radial-gradient(900px 500px at 50% 120%, rgba(95,212,255,.05), transparent 60%),
    linear-gradient(180deg,#02040A 0%, #050B14 55%, #070C13 100%);
  overflow:hidden;
  transition:opacity 1.1s ease, transform 1.1s ease;
}
#intro.parti{opacity:0;transform:scale(1.25);pointer-events:none}

.facade{
  position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  perspective:1400px;
}
.mur-facade{
  position:relative;width:min(1100px,100%);height:82vh;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 64px),
    linear-gradient(180deg,#0B121B 0%,#080D14 70%,#05080D 100%);
  border-left:2px solid rgba(255,255,255,.04);
  border-right:2px solid rgba(255,255,255,.04);
  overflow:hidden;
  transform:scale(1) translateY(0);
  transition:transform 2.6s cubic-bezier(.5,0,.2,1) 1.2s, filter 2.6s ease 1.2s;
  filter:brightness(1);
}
#intro.porte-ouverte .mur-facade{transform:scale(1.16) translateY(-1.5%);filter:brightness(1.12)}
.pilier{
  position:absolute;bottom:0;width:22px;height:100%;
  background:linear-gradient(180deg,#141B24,#0A0F16);
  box-shadow:inset -2px 0 6px rgba(0,0,0,.5);
}
.pilier.g{left:4%}
.pilier.d{right:4%}
.pilier::before{
  content:"";position:absolute;top:6%;bottom:10%;left:50%;width:2px;transform:translateX(-50%);
  background:rgba(95,212,255,.15);
  box-shadow:0 0 0 rgba(95,212,255,0);
  transition:box-shadow 1s ease, background 1s ease;
}
#intro.lumieres-on .pilier::before{
  background:rgba(95,212,255,.8);
  box-shadow:0 0 14px 2px rgba(95,212,255,.7);
}
.plaque-marque{
  position:absolute;top:44%;left:50%;transform:translateX(-50%);
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(95,212,255,.4);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:var(--neon);
  opacity:0;transition:opacity .8s ease 1s;
}
#intro.lumieres-on .plaque-marque{opacity:.8}
.bande-danger{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(560px,72%);height:10px;
  background:repeating-linear-gradient(135deg,#F4B400 0 14px,#161616 14px 28px);
  opacity:.85;
}
.sol-reflet{
  position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(180deg, rgba(95,212,255,.06), transparent);
  filter:blur(1px);
}
.brume{
  position:absolute;bottom:-4%;border-radius:50%;
  background:radial-gradient(circle, rgba(191,227,251,.22), transparent 70%);
  filter:blur(6px);pointer-events:none;opacity:0;
}
#intro.porte-ouverte .brume{opacity:1;animation:monterBrume 5s ease-in infinite}
@keyframes monterBrume{
  0%{transform:translateY(0) scale(1);opacity:0}
  15%{opacity:.7}
  100%{transform:translateY(-220px) scale(1.6);opacity:0}
}
.enseigne{
  position:absolute;top:7%;left:50%;transform:translateX(-50%);
  width:min(340px,50vw);
  opacity:0;transition:opacity .5s ease;
  z-index:2;
}
#intro.enseigne-on .enseigne{opacity:1}
.enseigne-halo{
  position:absolute;top:50%;left:50%;
  width:190%;height:190%;
  transform:translate(-50%,-50%) scale(1);
  background:radial-gradient(circle, rgba(95,212,255,.4) 0%, rgba(230,57,70,.16) 42%, transparent 70%);
  filter:blur(20px);
  pointer-events:none;
  animation:haloPulse 3.6s ease infinite;
}
@keyframes haloPulse{
  0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:.85;transform:translate(-50%,-50%) scale(1.07)}
}
.enseigne-support{
  position:relative;padding:12px;border-radius:12px;
  background:linear-gradient(160deg,#111820,#080B10);
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 22px 42px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.05);
  transform:perspective(1000px) rotateX(6deg);
  transform-origin:50% 100%;
}
.enseigne-logo{
  display:block;width:100%;height:auto;
  filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 16px rgba(95,212,255,.55))
    drop-shadow(0 0 32px rgba(230,57,70,.3))
    brightness(1);
  animation:flickerLogo 3.4s linear infinite;
}
@keyframes flickerLogo{
  0%,3%,6%,100%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 16px rgba(95,212,255,.55))
    drop-shadow(0 0 32px rgba(230,57,70,.3))
    brightness(1)}
  4%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 8px rgba(95,212,255,.3))
    drop-shadow(0 0 16px rgba(230,57,70,.15))
    brightness(.5)}
  5%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 12px rgba(95,212,255,.45))
    drop-shadow(0 0 24px rgba(230,57,70,.24))
    brightness(.82)}
  62%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 16px rgba(95,212,255,.55))
    drop-shadow(0 0 32px rgba(230,57,70,.3))
    brightness(1)}
  63%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 9px rgba(95,212,255,.32))
    drop-shadow(0 0 18px rgba(230,57,70,.16))
    brightness(.6)}
  64%{filter:
    drop-shadow(0 16px 22px rgba(0,0,0,.55))
    drop-shadow(0 0 16px rgba(95,212,255,.55))
    drop-shadow(0 0 32px rgba(230,57,70,.3))
    brightness(1)}
}
.ombre-enseigne{
  position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);
  width:78%;height:26px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 75%);
  filter:blur(4px);
}
.projecteur{
  position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(95,212,255,.16), transparent 70%);
  opacity:0;transition:opacity 1s ease;filter:blur(2px);
}
.projecteur.g{top:18%;left:6%}
.projecteur.d{top:18%;right:6%}
#intro.lumieres-on .projecteur{opacity:1}

.porte-cadre{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(560px,72%);height:64%;
  background:#02040A;
  border:3px solid #1C2733;border-bottom:none;
  border-radius:6px 6px 0 0;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.6) inset;
}
.lueur-interieure{
  position:absolute;inset:0;
  background:radial-gradient(420px 260px at 50% 108%, rgba(255,201,120,.55), rgba(95,212,255,.12) 55%, transparent 75%);
  opacity:0;transition:opacity 1.4s ease 1.6s;
}
#intro.porte-ouverte .lueur-interieure{opacity:1}
.porte-metal{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(180deg, #232D38 0 10px, #1A222C 10px 20px);
  transform:translateY(0%);
  transition:transform 2.1s cubic-bezier(.6,0,.3,1) 1.3s;
  box-shadow:0 6px 24px rgba(0,0,0,.6);
}
#intro.porte-ouverte .porte-metal{transform:translateY(-100%)}
.porte-rivets{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.06) 1.5px,transparent 1.6px);background-size:26px 26px;opacity:.5}

.intro-cta{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;transition:opacity .6s ease 3.2s;
}
#intro.pret .intro-cta{opacity:1}
.btn-entrer{
  padding:16px 38px;border-radius:999px;border:none;
  background:linear-gradient(180deg,var(--glacier),var(--neon));
  color:#04121C;font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset, 0 14px 34px rgba(95,212,255,.4);
  animation:respire 2.2s ease infinite;
}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.skip-intro{
  position:absolute;top:20px;right:20px;z-index:5;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  color:#C8DCEC;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 16px;border-radius:999px;font-family:'Space Mono',monospace;
}

/* ═══ SCÈNE PRINCIPALE ═══ */
#scene-viewport{
  position:fixed;inset:0;opacity:0;transition:opacity .9s ease;
  perspective:1600px;
}
#scene-viewport.visible{opacity:1}
#piste{
  height:100%;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#piste::-webkit-scrollbar{display:none}
.zone{
  flex:0 0 100vw;height:100%;position:relative;scroll-snap-align:center;
  overflow:hidden;
}

/* couches de profondeur communes */
.couche{position:absolute;inset:-10% -30%;pointer-events:none;will-change:transform}
.couche-mur{
  background:
    linear-gradient(180deg, rgba(95,212,255,.04), transparent 30%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 90px),
    linear-gradient(180deg,#0D141D 0%,#080D14 55%,#05080D 100%);
}
.couche-etageres{
  position:absolute;left:0;right:0;bottom:0;height:46%;
  background:
    linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.35) 90%),
    repeating-linear-gradient(180deg, #171E27 0 4px, #12181F 4px 8px);
  border-top:3px solid #232D38;
  box-shadow:0 -20px 50px rgba(0,0,0,.5) inset, 0 -1px 18px 2px rgba(95,212,255,.35);
}
.sol{
  position:absolute;left:0;right:0;bottom:0;height:14%;
  background:linear-gradient(180deg,#0A0F16,#020407);
  border-top:1px solid rgba(255,255,255,.05);
}
.sol-lumiere{
  position:absolute;left:50%;bottom:0;width:70%;height:100%;transform:translateX(-50%);
  background:radial-gradient(ellipse 60% 100% at 50% 0%, rgba(95,212,255,.16), transparent 75%);
  pointer-events:none;
}
.led-plafond{
  position:absolute;top:0;left:8%;right:8%;height:3px;
  background:linear-gradient(90deg,transparent,rgba(95,212,255,.9),transparent);
  box-shadow:0 0 24px 4px rgba(95,212,255,.5);
}
.cone-lumiere{
  position:absolute;top:0;width:220px;height:60%;
  background:linear-gradient(180deg, rgba(95,212,255,.16), transparent 85%);
  clip-path:polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  pointer-events:none;opacity:.75;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(2,4,9,.65) 100%),
    linear-gradient(180deg, rgba(2,4,9,.55), transparent 18%, transparent 78%, rgba(2,4,9,.6));
}
.poussiere{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;filter:blur(.5px)}
@keyframes flotter{
  0%{transform:translateY(0) translateX(0);opacity:0}
  10%{opacity:.6}
  90%{opacity:.4}
  100%{transform:translateY(-140px) translateX(30px);opacity:0}
}
body.allege .poussiere{display:none}
@media (prefers-reduced-motion: reduce){
  .poussiere{display:none}
  .brume{display:none}
  .badge-maquette .point{animation:none}
  .btn-entrer{animation:none}
  .enseigne-logo{animation:none}
  .enseigne-halo{animation:none}
  .podium-halo{animation:none}
  .mur-facade{transition:none}
}

/* ── titre de zone ── */
.zone-titre{
  position:absolute;top:9%;left:50%;transform:translateX(-50%);
  text-align:center;z-index:3;
}
.zone-titre .eyebrow{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.4em;
  text-transform:uppercase;color:var(--rouge);margin-bottom:6px;
}
.zone-titre h2{
  font-size:clamp(24px,4.4vw,42px);font-weight:900;font-style:italic;text-transform:uppercase;
  color:var(--neon);
  text-shadow:0 0 10px rgba(95,212,255,.6), 0 0 30px rgba(95,212,255,.35);
  animation:pulseTitre 3.6s ease infinite;
}
@keyframes pulseTitre{
  0%,100%{text-shadow:0 0 10px rgba(95,212,255,.6), 0 0 30px rgba(95,212,255,.35)}
  50%{text-shadow:0 0 14px rgba(95,212,255,.85), 0 0 42px rgba(95,212,255,.5)}
}
@media (prefers-reduced-motion: reduce){.zone-titre h2{animation:none}}

/* ── entrée ── */
.zone-entree .couche-mur{background:
  radial-gradient(700px 400px at 50% 20%, rgba(95,212,255,.08), transparent 60%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 90px),
  linear-gradient(180deg,#0D141D 0%,#080D14 55%,#05080D 100%);
}
.silhouette-outil{
  position:absolute;bottom:16%;opacity:.5;
  border:2px solid rgba(143,166,186,.35);border-radius:50%;
}
.silhouette-outil.roue1{width:120px;height:120px;left:8%}
.silhouette-outil.roue2{width:90px;height:90px;left:14%;bottom:10%}

/* ── décor : mur perforé + outils suspendus ── */
.pegboard{
  position:absolute;top:6%;left:0;right:0;height:26%;z-index:1;
  background-image:radial-gradient(circle,rgba(255,255,255,.07) 1.5px,transparent 1.6px);
  background-size:34px 34px;
  opacity:.55;
  -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);
  mask-image:linear-gradient(180deg,#000 60%,transparent);
}
.pegboard::before,.pegboard::after{
  content:"";position:absolute;top:20%;width:64px;height:14px;
  border:2px solid rgba(191,227,251,.3);border-radius:3px;
  box-shadow:0 30px 0 -8px rgba(191,227,251,.18);
}
.pegboard::before{left:14%;transform:rotate(-8deg)}
.pegboard::after{right:16%;width:44px;height:44px;border-radius:50%;top:14%}

/* ── décor : pile de pneus ── */
.pile-pneus{
  position:absolute;bottom:6%;width:96px;height:56px;z-index:2;opacity:.9;
}
.pile-pneus::before,.pile-pneus::after{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:96px;height:28px;border-radius:50%;
  background:repeating-conic-gradient(#0B0E12 0deg 8deg, #1B2027 8deg 16deg);
  box-shadow:0 6px 14px rgba(0,0,0,.6), 0 0 0 4px #060809 inset;
}
.pile-pneus::before{bottom:16px}
.pile-pneus::after{bottom:0}

/* ── décor : silhouette scooter en fond ── */
.scooter-silhouette{
  position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
  width:min(420px,70vw);height:150px;z-index:1;opacity:.14;
  background:var(--acier);
  clip-path:polygon(2% 88%,6% 60%,16% 55%,22% 40%,40% 34%,46% 20%,66% 18%,72% 34%,86% 40%,96% 58%,98% 88%,88% 88%,84% 74%,64% 74%,60% 88%,34% 88%,30% 74%,14% 74%,10% 88%);
  filter:blur(.5px);
}

/* ── décor : établi ── */
.etabli-silhouette{
  position:absolute;bottom:38%;left:6%;width:190px;height:10px;
  background:#232D38;box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
.etabli-silhouette::before,.etabli-silhouette::after{
  content:"";position:absolute;top:10px;width:6px;height:60px;background:#1A222C;
}
.etabli-silhouette::before{left:8px}
.etabli-silhouette::after{right:8px}
.intro-scene-cta{
  position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--acier);
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  z-index:3;
}
.fleche-glisse{width:34px;height:34px;animation:glisse 1.6s ease infinite}
@keyframes glisse{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(10px);opacity:1}}

/* ── podium tournant scooters vendus (zone entrée) ── */
.scene-podium{
  position:absolute;left:0;right:0;bottom:20%;z-index:4;
  height:min(280px,32vh);
  perspective:1300px;
  display:flex;align-items:flex-end;justify-content:center;
}
.podium-base{
  position:absolute;left:50%;bottom:-6%;transform:translateX(-50%) rotateX(76deg);
  width:min(70vw,620px);height:min(70vw,620px);border-radius:50%;
  background:
    radial-gradient(ellipse at center, rgba(20,26,33,.95) 0%, rgba(10,14,19,.7) 45%, transparent 74%),
    repeating-conic-gradient(rgba(255,255,255,.02) 0deg 2deg, transparent 2deg 8deg);
  box-shadow:0 0 0 1px rgba(95,212,255,.1) inset;
  pointer-events:none;
}
.podium-anneau-led{
  position:absolute;left:50%;bottom:-4.5%;transform:translateX(-50%) rotateX(76deg);
  width:min(64vw,560px);height:min(64vw,560px);border-radius:50%;
  box-shadow:0 0 0 2px rgba(95,212,255,.45), 0 0 34px 6px rgba(95,212,255,.32), 0 0 80px 18px rgba(95,212,255,.12);
  pointer-events:none;
  animation:anneauPulse 3.6s ease infinite;
}
@keyframes anneauPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.podium-anneau-led{animation:none}}
.podium-ring{
  position:absolute;left:50%;bottom:14%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateY(var(--rotation,0deg));
}
.carte-scooter{
  position:absolute;left:0;bottom:0;
  width:min(150px,24vw);
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,0) rotateY(var(--angle,0deg)) translateZ(var(--rayon,140px)) scale(var(--echelle,1));
  will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.podium-scooter{
  position:relative;width:100%;height:min(190px,24vh);
  display:flex;align-items:flex-end;justify-content:center;
}
.podium-halo{
  position:absolute;top:2%;left:50%;transform:translateX(-50%);
  width:135%;height:88%;
  background:radial-gradient(ellipse, rgba(95,212,255,.3), transparent 70%);
  filter:blur(16px);pointer-events:none;
  animation:haloPulse 4.2s ease infinite;
}
.podium-spot{
  position:absolute;top:-8%;left:50%;transform:translateX(-50%);
  width:160px;height:105%;
  background:linear-gradient(180deg, rgba(255,255,255,.16), transparent 82%);
  clip-path:polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
  pointer-events:none;
}
.photo-scooter{
  position:relative;z-index:2;
  max-width:88%;max-height:78%;object-fit:contain;
  -webkit-mask-image:radial-gradient(ellipse 66% 80% at 50% 52%, #000 62%, transparent 100%);
  mask-image:radial-gradient(ellipse 66% 80% at 50% 52%, #000 62%, transparent 100%);
  filter:
    drop-shadow(0 16px 12px rgba(0,0,0,.5))
    drop-shadow(0 0 18px rgba(95,212,255,.25));
  -webkit-box-reflect:below 3px linear-gradient(transparent, transparent 55%, rgba(191,227,251,.14));
}
.photo-scooter.fond-blanc{
  transform:scale(1.34);
  -webkit-mask-image:radial-gradient(ellipse 52% 60% at 50% 50%, #000 46%, transparent 86%);
  mask-image:radial-gradient(ellipse 52% 60% at 50% 50%, #000 46%, transparent 86%);

<script>
const CONFIG = {

};

/* Vraies pièces du catalogue — sous-ensemble pour cette maquette */
const PRODUITS_ARRIVAGES = [
  { nom:"Selle Nitro", prix:35, etat:"Occasion", modele:"Yamaha Nitro", compatible:"Nitro / Aerox",
    photo:"https://i.postimg.cc/d3pH9CMY/att-s-XUTVussl-Lh-Oqw9u-2la-WCs-Phe-V53gz-CP0UNPOT8Cw.jpg",
    description:"Selle d'origine en bon état, housse sans déchirure." },
  { nom:"Compteur", prix:80, etat:"Occasion", modele:"Yamaha Nitro", compatible:"Yamaha Nitro",
    photo:"https://i.postimg.cc/8PY3hZqb/1D38D209-F2A1-4338-9F69-F4529A89F8BA.jpg",
    description:"Compteur complet, cadran lisible, fonctionnement testé." }
];
const PRODUITS_MOTEURS = [
  { nom:"Transmission", prix:40, etat:"Occasion", modele:"MBK Booster", compatible:"MBK Booster",
    photo:"https://i.postimg.cc/kMxTqK9d/9E778C9E-DD18-4E16-BE45-40E63313A230.png",
    description:"Kit transmission complet, prêt à monter." },
  { nom:"Boîte à clapet", prix:10, etat:"Occasion", modele:"MBK Booster", compatible:"Booster 2004+",
    photo:"https://i.postimg.cc/L4T0jLW1/4396FF43-0F8C-4CA1-8896-AF7291C0C926.png",
    description:"Boîte à clapet fonctionnelle, clapets en bon état." },
  { nom:"Carbu 21 Motorforce", prix:50, etat:"Occasion", modele:"Universel", compatible:"Universel",
    photo:"https://i.postimg.cc/J4b4SVxz/att-RRLf8Jzdq1dl-RM-Cl4oz30x-Y3Gusrj-W3Bp-Zlgb-Mp93A.jpg",
    description:"Carburateur 21mm, révisé, prêt à l'installation." }
];

/* Scooters complets déjà vendus — vitrine de la zone Entrée */
const SCOOTERS_VENDUS = [
  { nom:"MBK Booster", photo:"./images/scooters-vendus/mbk-booster-1.png", fondBlanc:true },
  { nom:"MBK Booster", photo:"./images/scooters-vendus/mbk-booster-2.jpeg", fondBlanc:true }
];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const reduitMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const appareilLeger = (navigator.hardwareConcurrency || 4) < 4;
if (appareilLeger) document.body.classList.add("allege");

/* ═══ Rendu des cartes produit ═══ */
function rendreCartes(liste, conteneurId){
  const zone = $("#" + conteneurId);
  liste.forEach((p, i) => {
    const carte = document.createElement("button");
    carte.type = "button";
    carte.className = "carte-produit";
    carte.style.setProperty("--decalage", i);
    carte.innerHTML = `
      <div class="vitrine-photo"><img src="${p.photo}" alt="${p.nom}" loading="lazy"></div>
      <div class="nom">${p.nom}</div>
      <div class="prix mono">${p.prix} €</div>
    `;
    carte.addEventListener("click", () => ouvrirFiche(p, carte.closest(".zone")));
    zone.appendChild(carte);
  });
}
rendreCartes(PRODUITS_ARRIVAGES, "rangee-arrivages");
rendreCartes(PRODUITS_MOTEURS, "rangee-moteurs");

/* ═══ Podium tournant — scooters vendus ═══
   Anneau 3D en rotation lente et continue ; ralentit (sans s'arrêter)
   quand un scooter fait face à la caméra pour le laisser bien visible. */
function initPodiumTournant(){
  const anneau = $("#podium-ring");
  if (!anneau || !SCOOTERS_VENDUS.length) return;

  const n = SCOOTERS_VENDUS.length;
  const pasAngle = 360 / n;

  SCOOTERS_VENDUS.forEach((s, i) => {
    const carte = document.createElement("div");
    carte.className = "carte-scooter";
    carte.style.setProperty("--angle", (i * pasAngle) + "deg");
    carte.innerHTML = `
      <div class="podium-scooter">
        <div class="podium-halo"></div>
        <div class="podium-spot"></div>
        <img class="photo-scooter${s.fondBlanc ? " fond-blanc" : ""}" src="${s.photo}" alt="${s.nom}" loading="lazy">
        <div class="podium-plateforme"></div>
      </div>
      <div class="plaque-nom">${s.nom}</div>
    `;
    anneau.appendChild(carte);
  });

  const cartes = Array.from(anneau.querySelectorAll(".carte-scooter"));

  function calculerRayon(){
    const largeur = cartes[0] ? cartes[0].offsetWidth : 150;
    const rayon = (largeur / 2) / Math.tan(Math.PI / n) * 1.28;
    return Math.max(rayon, largeur * 0.95);
  }
  function appliquerRayon(){
    anneau.style.setProperty("--rayon", calculerRayon() + "px");
  }
  appliquerRayon();
  window.addEventListener("resize", appliquerRayon);

  /* Positionne/estompe une fois, sans animer, si mouvement réduit demandé */
  function poserCartesStatique(){
    cartes.forEach(c => {
      const angleCarte = parseFloat(c.style.getPropertyValue("--angle"));
      const effectif = ((angleCarte % 360) + 360) % 360;
      const delta = effectif > 180 ? 360 - effectif : effectif;
      const proximite = 1 - Math.min(delta / 90, 1);
      c.style.opacity = (0.4 + 0.6 * proximite).toFixed(2);
      c.style.setProperty("--echelle", (0.84 + 0.2 * proximite).toFixed(2));
      c.classList.toggle("carte-scooter--face", delta < pasAngle / 2.2);
    });
  }

  if (reduitMotion){
    poserCartesStatique();
    return;
  }

  let rotation = 0;
  let enPause = false;
  let dernierT = null;
  const vitesseBase = 7; /* degrés / seconde en vitesse de croisière */

  function easeProximite(delta){
    const demiPas = pasAngle / 2;
    const t = Math.min(delta / demiPas, 1);
    const lisse = t * t * (3 - 2 * t); /* smoothstep */
    return 0.12 + 0.88 * lisse;
  }

  function image(temps){
    if (dernierT === null) dernierT = temps;
    const dt = Math.min((temps - dernierT) / 1000, 0.1);
    dernierT = temps;

    if (!enPause){
      const offset = ((rotation % pasAngle) + pasAngle) % pasAngle;
      const delta = Math.min(offset, pasAngle - offset);
      rotation = (rotation + vitesseBase * easeProximite(delta) * dt) % 360;
      anneau.style.setProperty("--rotation", rotation + "deg");
    }

    cartes.forEach(c => {
      const angleCarte = parseFloat(c.style.getPropertyValue("--angle"));
      let effectif = ((angleCarte + rotation) % 360 + 360) % 360;
      if (effectif > 180) effectif -= 360;
      const delta = Math.abs(effectif);
      const proximite = 1 - Math.min(delta / 90, 1);
      c.style.opacity = (0.4 + 0.6 * proximite).toFixed(2);
      c.style.setProperty("--echelle", (0.84 + 0.2 * proximite).toFixed(2));
      c.classList.toggle("carte-scooter--face", delta < pasAngle / 2.2);
    });

    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);

  const scene = $("#scene-podium");
  scene.addEventListener("pointerenter", () => { enPause = true; });
  scene.addEventListener("pointerleave", () => { enPause = false; });
  scene.addEventListener("touchstart", () => { enPause = true; }, { passive:true });
  scene.addEventListener("touchend", () => { setTimeout(() => enPause = false, 1800); }, { passive:true });
}
initPodiumTournant();

/* ═══ Fiche produit ═══ */
function ouvrirFiche(p, zoneEl){
  $("#f-photo").src = p.photo;
  $("#f-photo").alt = p.nom;
  $("#f-nom").textContent = p.nom;
  $("#f-etat").textContent = p.etat;
  $("#f-compat").textContent = p.modele + " · " + p.compatible;
  $("#f-description").textContent = p.description;
  $("#f-prix").textContent = p.prix + " €";
  $("#f-contact").href = CONFIG.facebook;
  $("#fiche-overlay").classList.add("visible");
  $$(".zone").forEach(z => z.classList.remove("zone-highlight"));
  if (zoneEl) zoneEl.classList.add("zone-highlight");
}
function fermerFiche(){
  $("#fiche-overlay").classList.remove("visible");
  $$(".zone").forEach(z => z.classList.remove("zone-highlight"));
}
$("#btn-fermer-fiche").addEventListener("click", fermerFiche);
$("#fiche-overlay").addEventListener("click", e => { if (e.target.id === "fiche-overlay") fermerFiche(); });

/* ═══ Poussière dans les faisceaux ═══ */
function semerPoussiere(){
  if (reduitMotion || appareilLeger) return;
  $$(".zone").forEach(zone => {
    for (let i = 0; i < 5; i++){
      const grain = document.createElement("div");
      grain.className = "poussiere";
      const taille = 1.5 + Math.random() * 2;
      grain.style.width = taille + "px";
      grain.style.height = taille + "px";
      grain.style.left = (20 + Math.random() * 60) + "%";
      grain.style.bottom = (10 + Math.random() * 40) + "%";
      grain.style.animation = `flotter ${6 + Math.random() * 5}s ease-in ${Math.random() * 6}s infinite`;
      zone.appendChild(grain);
    }
  });
}
semerPoussiere();

/* ═══ Séquence d'intro ═══ */
function jouerIntro(){
  const intro = $("#intro");
  if (reduitMotion){
    intro.classList.add("parti");
    demarrerScene();
    return;
  }
  intro.classList.add("enseigne-on");
  setTimeout(() => intro.classList.add("lumieres-on"), 900);
  setTimeout(() => intro.classList.add("porte-ouverte"), 1700);
  setTimeout(() => intro.classList.add("pret"), 3300);
}
function entrerDansLeGarage(){
  const intro = $("#intro");
  intro.classList.add("parti");
  setTimeout(demarrerScene, 900);
}
function demarrerScene(){
  $("#scene-viewport").classList.add("visible");
  initNavigation();
}
$("#btn-entrer").addEventListener("click", entrerDansLeGarage);
$("#btn-skip").addEventListener("click", entrerDansLeGarage);
jouerIntro();

/* ═══ Navigation horizontale + parallaxe ═══ */
let navInitialisee = false;
function initNavigation(){
  if (navInitialisee) return;
  navInitialisee = true;

  const piste = $("#piste");
  const zones = $$(".zone");
  const points = $("#nav-points");
  const label = $("#label-zone");

  zones.forEach((z, i) => {
    const pt = document.createElement("button");
    pt.type = "button";
    pt.className = "nav-point" + (i === 0 ? " actif" : "");
    pt.setAttribute("aria-label", "Aller à la zone " + (i + 1));
    pt.addEventListener("click", () => aller(i));
    points.appendChild(pt);
  });

  function aller(i){
    zones[i].scrollIntoView({ behavior: reduitMotion ? "auto" : "smooth", inline: "center", block: "nearest" });
  }

  function maj(){
    const centre = piste.scrollLeft + piste.clientWidth / 2;
    let actif = 0;
    zones.forEach((z, i) => {
      if (z.offsetLeft <= centre) actif = i;
    });
    $$(".nav-point").forEach((pt, i) => pt.classList.toggle("actif", i === actif));
    label.textContent = zones[actif].dataset.nom;
    zones.forEach((z, i) => z.classList.toggle("zone-active", i === actif));

    if (!appareilLeger){
      $$("[data-vitesse]").forEach(couche => {
        const v = parseFloat(couche.dataset.vitesse);
        couche.style.transform = `translateX(${-piste.scrollLeft * v}px)`;
      });
    }
  }
  piste.addEventListener("scroll", maj, { passive: true });
  maj();

  /* molette verticale -> défilement horizontal (desktop) */
  piste.addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      e.preventDefault();
      piste.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  $("#fleche-gauche").addEventListener("click", () => piste.scrollBy({ left: -piste.clientWidth, behavior: "smooth" }));
  $("#fleche-droite").addEventListener("click", () => piste.scrollBy({ left: piste.clientWidth, behavior: "smooth" }));

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") piste.scrollBy({ left: piste.clientWidth, behavior: "smooth" });
    if (e.key === "ArrowLeft") piste.scrollBy({ left: -piste.clientWidth, behavior: "smooth" });
    if (e.key === "Escape") fermerFiche();
  });
}
</script>
